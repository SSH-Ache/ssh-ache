name: CI

# Verifies the frontend compiles on a supported Node. The Tauri (Rust) build
# runs in release.yml on tags; this is the fast per-push gate.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
